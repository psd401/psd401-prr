# Turns on auto-merge for a Dependabot PR whose every update is a patch to a
# development dependency (standards/04-security.md rule 4). GitHub merges it
# once the required checks pass. Every other PR waits for a person.
name: Dependabot auto-merge
"on": pull_request
permissions: {}
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-dependabot-auto-merge.yml@6e5e24ce26be55aebe0b786f4190cda409d4d33a # v1.10.0
    with:
      merge_method: merge
