name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association) && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.issue.author_association) && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Hard guardrails (psd-dev-standards standards/09): a bounded run, one run
    # per issue or PR at a time. A second @claude mention queues rather than
    # cancelling the answer already in progress.
    timeout-minutes: 20
    concurrency:
      group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The agent authenticates with its own token; leaving the checkout
          # credentials in .git/config would hand them to anything else in the
          # job (zizmor `artipacked`).
          persist-credentials: false
          fetch-depth: 1

      # Serving is Amazon Bedrock (us-west-2) with the org BEDROCK_API_KEY, the
      # same key and account OpenWiki and the PR review use, so spend lands on
      # the district AWS bill (psd-dev-standards standards/03, CIO decision
      # 2026-10-08). This replaces a personal subscription OAuth token, which
      # expires, and whose repo-level copy silently overrides the org secret.
      # The `global.` inference profiles are blocked by SCP, so the model ID
      # carries the `us.` prefix.
      #
      # The pin is v1.0.247, which ships Claude Code 2.1.295. Older action
      # releases are not interchangeable here: Bedrock rejected the 2.1.220
      # bundled with v1.0.231 for Sonnet 5.5, which is why this is a floor and
      # not just the newest tag at the time of writing.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064  # v1.0.265
        env:
          AWS_REGION: us-west-2
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
        with:
          use_bedrock: "true"
          # Turn cap and scoped Bash match the org reusable-claude-review (never
          # blanket Bash), plus read-only `gh run` so Claude can read CI results.
          claude_args: '--model us.anthropic.claude-sonnet-5-5 --max-turns 60 --allowed-tools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(gh run list:*)"'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # No `prompt:` on purpose: Claude follows the instructions in the
          # comment that tagged it. See the action's usage docs for the rest of
          # the `claude_args` options:
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
