# Portable object-store overlay retained for CI configuration validation only
# and storage-policy tests. The base deployment stack pins production identity
# semantics, so this is not an approved runnable local stack or another
# deployment destination. The AWS host uses docker-compose.aws.yml instead and
# keeps records in S3.
#
# This file owns every MinIO-shaped value. The base stack deliberately has
# none, because Compose interpolates the base before merging an overlay, so a
# required MinIO variable there would break the AWS host that has no MinIO.
x-object-store: &object-store
  OBJECT_STORE_ENDPOINT: "http://minio:9000"
  OBJECT_STORE_BUCKET: "prr-records"
  # The bucket-scoped identity minio-init creates, never the root credential.
  OBJECT_STORE_ACCESS_KEY: ${MINIO_APP_USER:-prr-app}
  OBJECT_STORE_SECRET_KEY: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in .env}

services:
  # Publishes no host ports, for the same reason db and redis don't: the
  # records bucket is reachable from sibling containers only.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket and the bucket-scoped application user, then
  # exits. Safe to re-run. The root credential lives only in this container.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/prr-records &&
        mc version enable local/prr-records &&
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD" &&
        mc admin policy create local prr-records-app /policies/prr-records.json &&
        mc admin policy attach local prr-records-app --user "$$MINIO_APP_USER"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_USER: ${MINIO_APP_USER:-prr-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in .env}
    volumes:
      - ./docker/minio-prr-records-policy.json:/policies/prr-records.json:ro
    restart: "no"

  # The schema bootstrap needs the bucket to exist before it seeds anything
  # that references it, so the store's one-shot has to finish first.
  migrate:
    environment: *object-store
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    environment: *object-store
    depends_on:
      minio:
        condition: service_healthy

  worker:
    environment: *object-store

  beat:
    environment: *object-store

volumes:
  miniodata:
