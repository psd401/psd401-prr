# Local backstop before push protection (psd-dev-standards standards/04 rule 9).
# CI still runs gitleaks through security-scan; this catches a secret before it
# is ever committed. Install once per clone:
#   uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
